name: Build Windows release — verified 4.3.1 onedir

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ish-onedir-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and verify Windows onedir package
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify active Python and install dependencies
        shell: pwsh
        run: |
          python --version
          python -c "import struct, sys; assert struct.calcsize('P') * 8 == 64, '64-bit Python is required'; print(sys.executable)"
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -c "import cryptography, cffi, _cffi_backend; from cryptography.exceptions import InvalidTag; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; from cryptography.hazmat.primitives.kdf.scrypt import Scrypt; print('cryptography preflight OK:', cryptography.__version__)"

      - name: Run release configuration and unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build standalone onedir application
        shell: cmd
        env:
          MOYA_BUILD_PYTHON: python
          GITHUB_ACTIONS: 'true'
        run: BUILD_EXE.bat

      - name: Verify app-local VC runtime DLLs are present
        shell: pwsh
        run: |
          $runtime = 'dist/ISH/_internal'
          foreach ($dll in @('python311.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            if (-not (Test-Path (Join-Path $runtime $dll))) {
              throw "Required app-local runtime DLL is missing: $dll"
            }
          }

      - name: Validate PowerShell folder updater syntax
        shell: powershell
        run: |
          python -c "from pathlib import Path; from updater_helper import _directory_updater_script; Path('updater_directory_helper.ps1').write_text(_directory_updater_script(), encoding='utf-8-sig')"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'updater_directory_helper.ps1').Path, [ref]$tokens, [ref]$errors)
          Remove-Item 'updater_directory_helper.ps1' -Force
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell folder updater has syntax errors.'
          }

      - name: Ensure Windows UCRT is not bundled
        shell: pwsh
        run: |
          $runtime = 'dist/ISH/_internal'
          if (Test-Path (Join-Path $runtime 'ucrtbase.dll')) {
            throw 'ucrtbase.dll must be resolved from Windows, not the application folder.'
          }
          $apiSet = @(Get-ChildItem -LiteralPath $runtime -Filter 'api-ms-win-crt-*.dll' -File -Recurse)
          if ($apiSet.Count -gt 0) {
            throw 'Windows API-set DLLs must not be copied from the build host.'
          }

      - name: Audit python311.dll PE dependency tree on Windows
        shell: pwsh
        run: python verify_pe_dependencies.py dist/ISH

      - name: Verify package manifest and all file hashes
        shell: pwsh
        run: python -c "from updater_helper import validate_app_directory; print('Validated package:', validate_app_directory('dist/ISH', '4.3.1')['version'])"

      - name: Verify onedir EXE starts without Python on PATH
        shell: pwsh
        run: |
          $exePath = (Resolve-Path 'dist/ISH/ISH.exe').Path
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $exePath
          $startInfo.Arguments = '--self-test-imports'
          $startInfo.WorkingDirectory = (Split-Path -Parent $exePath)
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.Environment['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot"
          $startInfo.Environment.Remove('PYTHONHOME')
          $startInfo.Environment.Remove('PYTHONPATH')
          $process = [System.Diagnostics.Process]::Start($startInfo)
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Standalone onedir EXE did not finish its isolated startup test within 120 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Onedir EXE failed without Python on PATH (exit code $($process.ExitCode))."
          }

      - name: Verify onedir package contains all runtime files
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/ISH.zip')) { throw 'Onedir ZIP package was not created.' }
          if (-not (Test-Path 'dist/ISH.zip.sha256')) { throw 'ZIP SHA-256 sidecar was not created.' }
          $manifest = Get-Content 'dist/ISH/build_manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne '4.3.1') { throw "Unexpected package version: $($manifest.version)" }
          if (@($manifest.files).Count -lt 100) { throw 'Onedir manifest unexpectedly contains too few runtime files.' }

      - name: Upload onedir package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ISH-4.3.1-onedir
          path: |
            dist/ISH.zip
            dist/ISH.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create release or replace assets
        if: github.ref == 'refs/tags/v4.3.1' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[refresh-v4.3.1]'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.3.1' }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" 'dist/ISH.zip' 'dist/ISH.zip.sha256' --clobber --repo "$env:GITHUB_REPOSITORY"
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            throw "Existing release $tag was not found. Refusing to create a new release from main."
          } else {
            gh release create "$tag" 'dist/ISH.zip' 'dist/ISH.zip.sha256' --title "ISH $tag" --generate-notes --repo "$env:GITHUB_REPOSITORY"
          }

      - name: Update v4.3.1 tag to validated root source
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[refresh-v4.3.1]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate --message "ISH 4.3.1 — onedir Windows 10 package" v4.3.1 $env:GITHUB_SHA
          git push --force origin refs/tags/v4.3.1
